name: Update EasyTier DNS records

# GitHub 的 schedule.cron 不支持引用变量，只能写死。
# 因此固定每 5 分钟"检查"一次，实际执行间隔由仓库变量 UPDATE_INTERVAL_MINUTES
# 控制（Settings → Secrets and variables → Actions → Variables，默认 30），
# 上次执行时间取自 last_run.json 的 ranAt，未到间隔的运行会直接跳过。
# 实际间隔 = UPDATE_INTERVAL_MINUTES ~ +5 分钟（检查点对齐），再叠加 GitHub
# 定时触发固有的几分钟到几十分钟延迟（平台限制，无法消除）。
# 域名由仓库变量 CF_DOMAIN 控制（必填，未设置时脚本会直接报错退出）。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 忽略执行间隔，立即运行
        type: boolean
        default: false

concurrency:
  group: update-dns
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check whether update is due
        id: due
        env:
          INTERVAL_MINUTES: ${{ vars.UPDATE_INTERVAL_MINUTES }}
        run: |
          case "$INTERVAL_MINUTES" in ''|*[!0-9]*) interval=30 ;; *) interval="$INTERVAL_MINUTES" ;; esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_ms=$(node -e "try{console.log(new Date(require('./last_run.json').ranAt).getTime())}catch{console.log(0)}")
          now_ms=$(node -e "console.log(Date.now())")
          echo "间隔 ${interval} 分钟，上次执行 $(date -u -d "@$((last_ms / 1000))" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo 无记录)"
          if [ $((now_ms - last_ms)) -ge $((interval * 60000)) ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'true'
        with:
          node-version: 20

      - name: Probe nodes and update Cloudflare
        if: steps.due.outputs.due == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_DOMAIN: ${{ vars.CF_DOMAIN }}
        run: node update_records.mjs

      - name: Commit run record
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.json
          if git diff --cached --quiet; then
            echo "last_run.json 无变化"
          else
            git commit -m "chore: dns update run $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
